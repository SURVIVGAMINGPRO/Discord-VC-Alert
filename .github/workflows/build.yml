name: Build apps

# Builds the macOS app (universal: Apple Silicon + Intel) and the Windows
# installer + portable .exe on GitHub's own machines. Run it from the Actions
# tab ("Run workflow"), or push a tag like v2.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run check
      - run: cargo test -p vc-core

      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: vc-alert-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/vc-alert.exe
